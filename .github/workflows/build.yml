name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: static
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          - mode: dynamic
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          - mode: windows
            container: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
          - mode: raspberrypi
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          - mode: arm64
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
            runner: ubuntu-24.04-arm
          - mode: singlethread
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          - mode: minimal
            container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
    container: ${{ matrix.container }}
    env:
      CIRCLE_OS_NAME: linux
      MODE: ${{ matrix.mode }}
      DEBIAN_FRONTEND: noninteractive
      TZ: America/New_York
      WINEPREFIX: /tmp/wine
    steps:
      - name: Install git for checkout
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache third-party downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: fwup-dl-${{ matrix.mode }}-${{ hashFiles('scripts/third_party_versions.sh') }}
          restore-keys: |
            fwup-dl-${{ matrix.mode }}-

      - name: Install Deps
        run: scripts/ci_install_deps.sh

      - name: Build
        run: scripts/ci_build.sh

      - name: Copy out artifacts
        if: startsWith(github.ref, 'refs/tags/v') && (matrix.mode == 'static' || matrix.mode == 'windows' || matrix.mode == 'raspberrypi' || matrix.mode == 'arm64')
        run: |
          scripts/ci_deploy.sh
        env:
          CIRCLECI: "true"
          CIRCLE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          CIRCLE_BRANCH: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: startsWith(github.ref, 'refs/tags/v') && (matrix.mode == 'static' || matrix.mode == 'windows' || matrix.mode == 'raspberrypi' || matrix.mode == 'arm64')
        with:
          name: fwup-linux-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: error

  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        mode: [static, dynamic]
    env:
      CIRCLE_OS_NAME: osx
      MODE: ${{ matrix.mode }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Deps
        run: scripts/ci_install_deps.sh

      - name: Build
        run: scripts/ci_build.sh

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

          read -r tag_type tag_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag '$RELEASE_TAG' must be an annotated, signed tag" >&2
            exit 1
          fi
          tag_data=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
          if [[ $(jq -r '.verification.verified' <<<"$tag_data") != "true" ]]; then
            echo "Release tag '$RELEASE_TAG' does not have a signature verified by GitHub" >&2
            exit 1
          fi
          if [[ $(jq -r '.object.sha' <<<"$tag_data") != "$GITHUB_SHA" ]]; then
            echo "Release tag '$RELEASE_TAG' moved after this workflow started" >&2
            exit 1
          fi

          expected=(
            CHANGELOG.md
            "fwup-$version.tar.gz"
            "fwup-$version-windows-x86_64.exe"
            "fwup.$version.nupkg"
            "fwup_${version}_amd64.deb"
            "fwup_${version}_arm64.deb"
            "fwup_${version}_armhf.deb"
          )
          for artifact in "${expected[@]}"; do
            if [[ ! -f "downloaded-artifacts/$artifact" ]]; then
              echo "Missing release artifact: $artifact" >&2
              exit 1
            fi
          done

          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-release-artifacts"
          : > "$RUNNER_TEMP/actual-release-artifacts"
          for artifact in downloaded-artifacts/*; do
            if [[ ! -f "$artifact" ]]; then
              echo "Unexpected non-file release artifact: $artifact" >&2
              exit 1
            fi
            basename "$artifact" >> "$RUNNER_TEMP/actual-release-artifacts"
          done
          sort -o "$RUNNER_TEMP/actual-release-artifacts" "$RUNNER_TEMP/actual-release-artifacts"
          if ! diff -u "$RUNNER_TEMP/expected-release-artifacts" "$RUNNER_TEMP/actual-release-artifacts"; then
            echo "Unexpected release artifact set" >&2
            exit 1
          fi

      - name: Generate release SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          scripts/generate_sbom.sh \
            "downloaded-artifacts/fwup-$version.spdx.json" \
            "$version" \
            "$RELEASE_TAG" \
            "$GITHUB_SHA"
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length) == 12' \
            "downloaded-artifacts/fwup-$version.spdx.json" >/dev/null

      - name: Generate release checksums
        working-directory: downloaded-artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Create release notes
        run: |
          grep -Pazo "(?s)(?<=## ${GITHUB_REF_NAME})[^#]+" CHANGELOG.md | sed '/./,$!d' > /tmp/RELEASE_NOTES
          if [[ ! -s /tmp/RELEASE_NOTES ]]; then
            echo "No CHANGELOG section found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          cat /tmp/RELEASE_NOTES

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: downloaded-artifacts/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            downloaded-artifacts/*.deb
            downloaded-artifacts/*.exe
            downloaded-artifacts/*.nupkg
            downloaded-artifacts/*.tar.gz
          sbom-path: downloaded-artifacts/fwup-*.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: /tmp/RELEASE_NOTES
          files: downloaded-artifacts/*
